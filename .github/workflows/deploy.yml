name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run type check
        run: pnpm run type-check

      - name: Check formatting
        run: pnpm exec prettier --check "src/**/*.ts"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and inject ROUTES_CONFIG
        env:
          ROUTES_CONFIG: ${{ vars.ROUTES_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${ROUTES_CONFIG}" ]]; then
            echo "ROUTES_CONFIG GitHub repository variable is required." >&2
            exit 1
          fi
          MINIFIED_CONFIG="$(jq -ce 'if type == "object" and length > 0 then . else error("ROUTES_CONFIG must be a non-empty JSON object") end' <<< "${ROUTES_CONFIG}")"
          sed -i '/^\[vars\]/,$d' wrangler.toml
          {
            printf '\n[vars]\n'
            printf "ROUTES_CONFIG = '''%s'''\n" "${MINIFIED_CONFIG}"
          } >> wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
