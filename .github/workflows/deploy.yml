name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Verify and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all code checks
        run: npm run check

      - name: Validate and inject ROUTES_CONFIG
        if: github.ref == 'refs/heads/main'
        env:
          ROUTES_CONFIG: ${{ vars.ROUTES_CONFIG }}
        run: |
          set -euo pipefail
          if [[ -z "${ROUTES_CONFIG}" ]]; then
            echo "ROUTES_CONFIG GitHub repository variable is required." >&2
            exit 1
          fi
          MINIFIED_CONFIG="$(jq -ce 'if type == "object" and length > 0 then . else error("ROUTES_CONFIG must be a non-empty JSON object") end' <<< "${ROUTES_CONFIG}")"
          sed -i '/^\[vars\]/,$d' wrangler.toml
          {
            printf '\n[vars]\n'
            printf "ROUTES_CONFIG = '''%s'''\n" "${MINIFIED_CONFIG}"
          } >> wrangler.toml

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
