name: Lint and Type Check

permissions:
  contents: write

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

jobs:
  lint:
    name: Lint, Type Check, Tests and Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Refresh lockfile for compatible Worker tooling
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Format audit branch sources
        if: github.ref == 'refs/heads/audit/full-proxy-hardening'
        run: |
          npm audit fix
          npx prettier --write "src/**/*.ts" "tests/**/*.cjs" package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Source files are already formatted."
            exit 0
          fi
          git commit -m "style: format audit branch sources and tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Run complete verification
        run: npm run check
